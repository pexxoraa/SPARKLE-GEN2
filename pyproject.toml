[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkle-gen2"
version = "0.2.0a1"
description = "SPARKLE Gen-2 personal AI operating agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sparkle-personal-ai>=0.30.0a1,<0.31",
  "Pillow==12.3.0",
  "google-api-python-client>=2.200,<3",
  "google-auth>=2.58,<3",
  "google-auth-httplib2>=0.4,<1",
  "google-genai>=2.24,<3",
  "websockets>=13,<17",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
sparkle = "sparkle_gen2.cli:entrypoint"
sparkle-gen2 = "sparkle_gen2.cli:entrypoint"
sparkle-personal-core = "sparkle_gen2.personal_core:entrypoint"
sparkle-background-worker = "sparkle_gen2.background_worker_cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparkle_gen2 = ["*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.json", "web/*.png"]

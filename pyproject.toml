[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkle-gen2"
version = "0.2.0a1"
description = "SPARKLE Gen-2 personal AI operating agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sparkle = "sparkle_gen2.cli:entrypoint"
sparkle-gen2 = "sparkle_gen2.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
